<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <!-- Hero Section for 404 -->
  <section class="section hero-section-bg" style="min-height: 100vh; display: flex; align-items: center; position:relative; overflow:hidden;">

      <div class="hero-content fade-up" style="max-width: 800px; margin: 0 auto; padding: 40px 20px;">
        <i class="fa-solid fa-scale-unbalanced text-gold" style="font-size: 80px; margin-bottom: 30px;"></i>
        <h1 style="margin-bottom:20px; font-size: 4rem;">404 <span class="text-gold" style="display:block; font-size: 3rem;">Page Not Found</span></h1>
        <p style="font-size: 1.2rem; margin: 0 0 40px 0; color: var(--text-primary); font-weight: 500;">We're sorry, but the page you are looking for doesn't exist or has been moved.</p>
        
        <div style="display:flex; justify-content:center; gap:20px;">
          <a href="index.html" class="btn btn-gold">Return to Homepage</a>
        </div>
      </div>
    </div>
